name: Lighthouse CI & Accessibility Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate PDFs
        run: npm run generate:pdfs

      - name: Optimize images
        run: npm run optimize:images

      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /frahmanandbrothers

      - name: Generate sitemap
        run: npm run generate:sitemap

      - name: Serve static files
        run: |
          npm install -g serve
          serve -s out -l 8080 &
          sleep 5

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.13.x
          lhci autorun --config=lighthouserc.json || echo "Lighthouse warnings detected"
        continue-on-error: true

      - name: Install axe-core CLI
        run: npm install -g @axe-core/cli

      - name: Run axe accessibility tests
        run: |
          axe http://localhost:8080/frahmanandbrothers/ --exit || echo "Accessibility issues detected"
        continue-on-error: true

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        run: |
          echo "Lighthouse and accessibility audit completed. Check artifacts for detailed reports."
